# ==============================================================================
# ruff.toml — конфигурация линтера и форматтера Ruff
# Проект: анализ данных (pandas, Jupyter Notebook)
# Документация Ruff: https://docs.astral.sh/ruff/
# ==============================================================================

# ------------------------------------------------------------------------------
# ГЛОБАЛЬНЫЕ НАСТРОЙКИ
# ------------------------------------------------------------------------------

# Версия Python, для которой пишется код.
# Влияет на правила, связанные с синтаксисом и устаревшими конструкциями.
target-version = "py313"

# Максимальная длина строки. 88 — стандарт Black/Ruff.
# Форматтер будет переносить строки, превышающие это значение.
line-length = 88

# Ширина отступа в пробелах.
indent-width = 4

# Файлы и директории, которые Ruff должен ИГНОРИРОВАТЬ полностью.
# .ipynb_checkpoints — служебные копии Jupyter, проверять их не нужно.
exclude = [
    ".git",
    ".venv",
    ".ruff_cache",
    "__pycache__",
    ".ipynb_checkpoints",
]

# Подключаем файлы .ipynb (Jupyter Notebook) к проверке.
# По умолчанию Ruff их НЕ обрабатывает — нужен явный opt-in.
# Подключаем .md (Markdown) для форматирования Python-блоков в документации.
# Важно: для .md работает ТОЛЬКО форматтер (ruff format), но НЕ линтер (ruff check).
extend-include = ["*.ipynb", "*.md"]

# ------------------------------------------------------------------------------
# НАСТРОЙКИ ЛИНТЕРА ([lint])
# ------------------------------------------------------------------------------
[lint]

# Список групп правил, которые будут ВКЛЮЧЕНЫ.
# Каждая буква/префикс — это отдельный плагин или набор правил.
select = [
    # --- Базовые правила качества кода ---
    "E",   # pycodestyle errors: отступы, пробелы, синтаксис PEP 8
    "W",   # pycodestyle warnings: предупреждения о стиле (trailing whitespace и т.д.)
    "F",   # Pyflakes: неиспользуемые импорты, неопределённые переменные и т.д.

    # --- Импорты ---
    "I",   # isort: сортировка и группировка импортов (заменяет утилиту isort)

    # --- Улучшение кода ---
    "UP",  # pyupgrade: замена устаревших конструкций на современные (f-strings и т.д.)
    "B",   # flake8-bugbear: распространённые ошибки и антипаттерны
    "SIM", # flake8-simplify: упрощение излишне сложных конструкций

    # --- Специфичные правила для pandas ---
    "PD",  # pandas-vet: правила корректного использования pandas API

    # --- Аннотации типов ---
    "ANN", # flake8-annotations: проверка наличия аннотаций типов у функций

    # --- Документация ---
    "D",   # pydocstyle: проверка докстрингов (стиль, наличие, формат)
]

# Правила, которые ИСКЛЮЧАЮТСЯ из проверки.
# Причина каждого исключения указана в комментарии.
ignore = [
    # --- Конфликты с форматтером ---
    # Эти правила управляют форматированием вручную, но Ruff-форматтер
    # сам берёт это на себя. Оставлять их — значит получать ложные срабатывания.
    "E501",  # line-too-long: длиной строки управляет форматтер через line-length
    "W191",  # indentation contains tabs: форматтер сам расставит пробелы
    "E111",  # indentation-not-multiple-of-four: форматтер исправит автоматически
    "E114",  # indentation-not-multiple-of-four (comment): аналогично
    "E117",  # over-indented: форматтер исправит автоматически

    # --- Конфликтующие правила докстрингов ---
    # D211 и D203 взаимоисключают друг друга (пустая строка перед классом или нет).
    # D212 и D213 взаимоисключают друг друга (summary на первой или второй строке).
    # Выбираем D211 (нет пустой строки) + D212 (summary на первой строке) —
    # этот вариант соответствует стилю Google и используется чаще всего.
    "D203",  # one-blank-line-before-class: конфликтует с D211 (нет строки перед классом)
    "D213",  # multi-line-summary-second-line: конфликтует с D212 (summary на первой строке)

    # --- Послабления для документации модуля ---
    "D100",  # missing-docstring-in-public-module: не всегда нужен докстринг модуля
    "D104",  # missing-docstring-in-public-package: аналогично для пакета
    "D415",  # first-line-should-end-with-period: точка в конце summary избыточна
    "D205",  # blank-line-after-summary: пустая строка между summary и description

    # --- Аннотации в ноутбуках ---
    # ANN201 — отсутствие аннотации возвращаемого типа у публичных функций.
    # В аналитических ноутбуках функции часто вспомогательные, аннотации избыточны.
    "ANN201", # missing-return-type-undocumented-public-function: избыточно для ноутбуков
    "ANN001", # missing-type-function-argument: в аналитических скриптах часто излишне
]

# Разрешить автоматическое исправление для ВСЕХ включённых правил.
# При запуске `ruff check --fix` Ruff исправит всё, что умеет.
fixable = ["ALL"]

# Правила, которые НЕ должны исправляться автоматически, даже если умеют.
# Оставляем пустым — пусть исправляет всё.
unfixable = []

# Настройки для конкретных типов файлов через per-file-ignores.
# Jupyter Notebook требует особого подхода: импорты могут быть в любой ячейке.
[lint.per-file-ignores]
"*.ipynb" = [
    "E402",  # module-import-not-at-top-of-file: в ноутбуках импорты часто в середине
    "B018",  # useless-expression: в ноутбуках выражения без присваивания — вывод значений
    "D",     # pydocstyle: докстринги в ноутбуках избыточны (это не библиотека)
    "ANN",   # flake8-annotations: аннотации в ноутбуках избыточны
]

# Настройки сортировки импортов (плагин isort, префикс "I").
[lint.isort]
# Pandas, numpy, matplotlib и т.д. относятся к сторонним библиотекам (third-party).
# Если в проекте появятся собственные модули, их нужно добавить в known-first-party.
known-third-party = ["pandas", "numpy", "matplotlib", "seaborn", "requests"]
# known-first-party = ["mypackage"]  # раскомментировать при наличии своих модулей

# Сортировка импортов без разделения на секции (все вместе — удобнее в ноутбуках).
force-sort-within-sections = true

# Настройки докстрингов (плагин pydocstyle, префикс "D").
[lint.pydocstyle]
# Стиль докстрингов: "google" (рекомендуется для аналитических проектов),
# альтернативы: "numpy", "pep257".
convention = "google"

# ------------------------------------------------------------------------------
# НАСТРОЙКИ ФОРМАТТЕРА ([format])
# ------------------------------------------------------------------------------
[format]

# Стиль кавычек: "double" (стандарт Black) или "single".
quote-style = "double"

# Стиль отступов: "space" (пробелы) или "tab".
indent-style = "space"

# Уважать "магическую" trailing запятую — если она стоит, не схлопывать в одну строку.
# Совместимо со стилем Black.
skip-magic-trailing-comma = false

# Автоматически определять окончание строк (\n или \r\n).
line-ending = "auto"

# Форматировать Python-блоки внутри докстрингов.
# Полезно, если в докстрингах есть примеры кода.
docstring-code-format = true

# Длина строки для кода в докстрингах ("dynamic" = подстраивается под контекст).
docstring-code-line-length = "dynamic"

# Включить PREVIEW-режим форматтера.
# В preview появляется поддержка форматирования Python-блоков в Markdown-файлах (.md).
# Это единственный способ заставить `ruff format` работать с .md-файлами.
# ВАЖНО: preview-функции могут изменяться между версиями ruff — следите за CHANGELOG.
preview = true